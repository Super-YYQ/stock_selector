data:
  provider: tdx
  database: data/stock.db
  start_date: "2023-01-01"
  tdx_parallel_workers: 4
  tdx_parallel_chunk_size: 50
  tdx_timeout_seconds: 3
  tdx_query_retries: 3
  init_min_stock_coverage: 0.90
  init_min_daily_rows: 100000
  init_min_index_count: 3
  analysis_lookback_days: 240
  baostock_query_retries: 3
  baostock_reconnect_interval: 200
  baostock_parallel_workers: 2
  baostock_parallel_chunk_size: 20

report:
  top_observe: 50
  top_focus: 10
  output_dir: reports
  site_dir: site
  history_days: 90

panel:
  host: 127.0.0.1
  port: 8765
  open_browser: true

features:
  enable_sector_score: true
  enable_rps: true
  enable_ai_summary: false

scoring:
  sector_score_weight: 25
  stock_character_weight: 20
  volume_price_weight: 25
  relative_strength_weight: 15
  market_adjust_weight: 10
  risk_penalty_max: 20

strategies:
  enabled:
    - ma_volume
    - turtle_breakout
    - rps_breakout
    - pullback_stable
    - limit_up_shakeout
    - volatility_squeeze
    - trend_pullback_reversal
    - low_volatility_rps
    - first_pullback
    - sector_leader
  profile: balanced
  strategy_score_weight: 15
  top_per_strategy: 20
