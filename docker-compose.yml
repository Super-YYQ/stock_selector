services:
  stock-selector:
    build: .
    container_name: stock-selector
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./site:/app/site
